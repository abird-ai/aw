[workspace]
resolver = "2"
members = [
    "crates/aw-agent-kernel",
    "crates/aw-routing",
    "crates/aw-pipeline",
    "examples/process-extension-rust",
    "crates/aw-editor",
    "crates/aw-ui-extension",
    "crates/aw-collab",
    "crates/aw-platform",
    "crates/aw-platform-unix",
    "crates/aw-platform-win",
    "examples/sdk-rpc-client",
    "crates/aw-identity",
    "examples/sdk-kernel",
    "crates/aw-embedded",
    "crates/aw-workspace",
    "crates/aw-client",
    "crates/aw-terminal",
    "crates/aw-git",
    "examples/sdk-identity",
    "examples/sdk-embedded",
    "crates/aw-embedded-ffi",
    "examples/sdk-layout",
    "examples/sdk-client",
    "examples/sdk-terminal",
    "examples/sdk-review",
    "crates/aw-agent-core",
    "examples/sdk-embedded-ffi-staticlib",
    "crates/aw-mcp",
    "crates/aw-extensions",
    "crates/aw-store-api",
    "crates/aw-inference",
    "crates/aw-tools",
]

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.17"
