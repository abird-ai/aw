[workspace]
resolver = "2"
members = [
    "crates/aw-agent-kernel",
    "crates/aw-routing",
    "crates/aw-pipeline",
    "examples/process-extension-rust",
    "crates/aw-editor",
    "crates/aw-ui-extension",
]

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.17"
