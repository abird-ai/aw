[workspace]
resolver = "2"
members = [
    "crates/aw-agent-kernel",
    "crates/aw-routing",
    "crates/aw-pipeline",
    "examples/process-extension-rust",
    "crates/aw-editor",
    "crates/aw-ui-extension",
    "crates/aw-collab",
    "crates/aw-platform",
    "crates/aw-platform-unix",
    "crates/aw-platform-win",
    "examples/sdk-rpc-client",
    "crates/aw-identity",
    "examples/sdk-kernel",
]

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
thiserror = "=2.0.17"
