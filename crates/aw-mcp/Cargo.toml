[package]
name = "aw-mcp"
version = "0.15.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Explicit stdio/Streamable HTTP MCP client adapters for aw"

[dependencies]
aw-agent-core = { version = "=0.15.0", path = "../aw-agent-core" }
aw-agent-kernel = { version = "=0.15.0", path = "../aw-agent-kernel" }
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client-reqwest", "reqwest"] }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { version = "=1.48.0", features = ["time", "process", "sync", "rt", "macros", "io-util"] }
getrandom = "=0.3.4"
clap = { version = "=4.5.50", features = ["derive"] }
jsonschema = { version = "=0.58.6", default-features = false }
reqwest = { version = "=0.13.2", default-features = false, features = ["rustls", "stream"] }
url = "=2.5.7"
zeroize = "=1.9.0"
futures-util = "=0.3.31"
tokio-util = { version = "=0.7.19", features = ["codec", "rt"] }

[lints.rust]
unsafe_code = "forbid"
