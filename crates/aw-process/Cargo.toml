[package]
name = "aw-process"
version = "0.15.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Agent-neutral async Process lifetime, containment, pipe and settlement runtime for aw"

[dependencies]
aw-tools = { path = "../aw-tools", version = "=0.15.0", default-features = false, features = ["batch"] }
aw-platform = { path = "../aw-platform", version = "=0.15.0" }
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "time", "sync", "signal"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
