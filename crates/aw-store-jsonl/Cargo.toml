[package]
name = "aw-store-jsonl"
version = "0.15.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Append-only single-user JSONL session backend for aw"

[dependencies]
aw-agent-core = { path = "../aw-agent-core", version = "=0.15.0" }
aw-store-api = { path = "../aw-store-api", version = "=0.15.0" }
aw-platform = { path = "../aw-platform", version = "=0.15.0" }
serde = { workspace = true }
serde_json = { workspace = true }
getrandom = "=0.3.4"
fs2 = "=0.4.3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]
futures-lite = "=2.6.1"
tokio = { version = "=1.48.0", default-features = false, features = ["rt", "macros"] }
