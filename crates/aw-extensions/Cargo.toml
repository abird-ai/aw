[package]
name = "aw-extensions"
version = "0.15.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Versioned bounded process-extension host for aw Agent hooks and tools"

[dependencies]
aw-agent-core = { version = "=0.15.0", path = "../aw-agent-core" }
aw-agent-kernel = { version = "=0.15.0", path = "../aw-agent-kernel" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "=4.5.50", features = ["derive"] }
tokio = { version = "=1.48.0", features = ["time", "process", "sync", "io-util"] }
tokio-util = { version = "=0.7.19", features = ["codec"] }
futures-util = "=0.3.31"
jsonschema = { version = "=0.58.6", default-features = false }
getrandom = "=0.3.4"

[lints.rust]
unsafe_code = "forbid"
