[package]
name = "aw-tools-adapter"
version = "0.15.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
description = "AW-specific adapter for canonical aw-tools semantics and Process integration"

[features]
default = []
pty = ["dep:aw-terminal"]

[dependencies]
aw-tools = { path = "../aw-tools", version = "=0.15.0", default-features = false, features = ["rw", "async", "durable", "batch"] }
aw-terminal = { path = "../aw-terminal", version = "=0.15.0", optional = true }
aw-platform = { version = "=0.15.0", path = "../aw-platform" }
aw-agent-core = { path = "../aw-agent-core", version = "=0.15.0" }
serde = { workspace = true }
serde_json = { workspace = true }
regex = "=1.12.3"
base64 = "=0.22.1"
url = "=2.5.7"
sha2 = "=0.10.9"
getrandom = "=0.3.4"
anyhow = "=1.0.104"
globset = "=0.4.18"
ignore = "=0.4.25"
tokio = { version = "=1.48.0", features = ["rt", "macros", "process", "io-util", "time", "sync"] }
futures-util = "=0.3.31"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
