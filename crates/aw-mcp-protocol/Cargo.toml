[package]
name = "aw-mcp-protocol"
version = "0.15.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Transport-neutral MCP result, receipt and progress projection helpers for aw"

[dependencies]
aw-tools = { version = "=0.15.0", path = "../aw-tools", default-features = false }
rmcp = { version = "=3.5.0", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["time", "macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"
