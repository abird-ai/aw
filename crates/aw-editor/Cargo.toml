[package]
name = "aw-editor"
version = "0.15.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Bounded grapheme-aware text editor primitive shared by aw TUIs"

[dependencies]
thiserror = { workspace = true }
