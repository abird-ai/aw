[package]
name = "aw-platform-unix"
version = "0.15.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Unix platform primitives for aw"

[features]
default = []
local-ipc = ["dep:tokio"]

[dependencies]
tokio = { version = "=1.48.0", features = ["net"], optional = true }
libc = "=0.2.177"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
