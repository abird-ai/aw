[package]
name = "aw-git"
version = "0.15.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Bounded Git snapshots and reviewed index changes, independent of agents and renderers"

[dependencies]
aw-platform = { version = "=0.15.0", path = "../aw-platform" }
serde = { workspace = true }
thiserror = { workspace = true }
sha2 = "=0.10.9"

[dev-dependencies]
serde_json = { workspace = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
