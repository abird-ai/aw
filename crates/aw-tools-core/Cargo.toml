[package]
name = "aw-tools-core"
version = "0.15.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
description = "Transport-neutral synchronous tooling algorithms and optional task adapters"

[features]
default = ["read-only"]
# Presets select compiled algorithms, never issue runtime permissions.
read-only = ["read", "binary"]
rw = ["read-only", "write", "lifecycle"]
full = ["rw", "async", "durable", "sandbox", "batch"]
read = []
write = []
lifecycle = []
batch = []
binary = []
sync = []
async = ["dep:tokio"]
durable = ["dep:libc", "dep:windows-sys"]
sandbox = ["dep:libc"]

[dependencies]
anyhow = "=1.0.104"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "=0.10.9"
memchr = "=2.8.3"
regex = "=1.12.3"
globset = "=0.4.18"
ignore = "=0.4.25"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "serde"] }
tokio = { version = "=1.48.0", features = ["rt"], optional = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"


[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.177", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", optional = true, features = [
  "Win32_Foundation", "Win32_Storage_FileSystem"
] }
