<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1092" viewBox="0 0 1040 1092" role="img" aria-labelledby="aw-architecture-title aw-architecture-desc">
  <title id="aw-architecture-title">AW live programmable graph-native agent harness</title>
  <desc id="aw-architecture-desc">CLI, TUI, Web, Rust SDK and MCP clients use one native Service and shared API. Immutable harness revisions compose context, strategy, routing and tools over the original Agent, TurnMachine, Actors and pipelines. AI-native tools share the aw-tools core across native calls and MCP composition. The model-facing batch expression describes fixed dependency graphs with bounded parallel work and per-node results; graph execution uses the original Job and Process owners. State, history and execution receipts remain with their owners. Authorized observations and ordinary bounded evaluation work inform revisions through the same activation API. Inference providers such as ZeroGravity and tool or environment providers such as dotlink remain separate execution boundaries.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; font-size: 17px; fill: #e8e8e8; }
      .title { font-size: 25px; font-weight: 700; }
      .heading { font-size: 20px; font-weight: 700; }
      .client-label { font-size: 18px; font-weight: 600; }
      .small { font-size: 15px; }
      .muted { fill: #bebebe; }
      .canvas { fill: #101010; stroke: #333; }
      .panel { fill: #161616; stroke: #414141; }
      .component { fill: #1c1c1c; stroke: #444; }
      .provider { fill: #222; stroke: #505050; }
      .arrow { fill: none; stroke: #b6b6b6; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .feedback { fill: none; stroke: #929a9f; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 5 5; }
    </style>
    <marker id="aw-architecture-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L6 3.5 L0 7" fill="none" stroke="#b6b6b6" stroke-width="1.4"/>
    </marker>
  </defs>

