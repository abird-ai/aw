    <text x="276" y="972">ZeroGravity · other providers</text>
    <text class="small muted" x="276" y="999">Model execution and inference programs</text>
    <text class="heading" x="764" y="942">Tools &amp; environments</text>
    <text x="764" y="972">dotlink · local and remote executors</text>
    <text class="small muted" x="764" y="999">Source, process and resource effects</text>
  </g>

  <text class="small muted" x="520" y="1059" text-anchor="middle">AW composes agent behavior. Providers retain their own execution ownership.</text>
</svg>
