<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="786" viewBox="0 0 1280 786" role="img" aria-labelledby="diagramTitle diagramDesc">
<title id="diagramTitle">AW graph-native tool execution</title>
<desc id="diagramDesc">One batch invocation is statically preflighted, admitted as a single immutable Graph Job, and schedules independent native read and grep nodes together where safe. Dependent edit and Bash test nodes run in order, with factual per-node receipts.</desc>
