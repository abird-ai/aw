<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="712" viewBox="0 0 1280 712" role="img" aria-labelledby="diagramTitle diagramDesc">
<title id="diagramTitle">AW runtime architecture</title>
<desc id="diagramDesc">Surfaces connect to one AW Agent engine and TurnMachine, with provider inference, an exact tool-policy boundary, immutable TurnJournal, and an embeddable aw-tools filesystem Graph and Job core.</desc>
